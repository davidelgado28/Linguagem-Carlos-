name: 🔧 Carlos CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Verificar ferramentas
        run: |
          g++ --version
          bash --version

      - name: Compilar exemplos
        run: |
          chmod +x bin/carlosc src/carlos.sh
          make exemplos

      - name: Rodar testes
        run: make test

      - name: Testar jogo de exemplo 
        run: |
          g++ exemplos/adivinhacao.cpp -o /tmp/jogo
          echo "50" | timeout 5 /tmp/jogo || true
